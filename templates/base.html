<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stok Takip{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --border: #e3e6eb;
      --primary: #2563eb; --primary-dark: #1d4ed8; --green: #15803d; --green-bg: #dcfce7;
      --red: #b91c1c; --red-bg: #fee2e2; --amber: #92400e; --amber-bg: #fef3c7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { background: #111827; color: #fff; }
    header .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 12px; }
    header a { color: #cbd5e1; text-decoration: none; }
    header a:hover, header a.active { color: #fff; }
    header .brand { font-weight: 700; font-size: 17px; color: #fff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; }
    main { padding-block: 24px; }
    .wrap.wide { max-width: 1500px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .spacer { flex: 1; }
    .btn { display: inline-block; border: 1px solid var(--border); background: #fff; color: var(--text);
           padding: 7px 14px; border-radius: 7px; cursor: pointer; text-decoration: none; font: inherit; }
    .btn:hover { background: #f1f3f6; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-danger { color: var(--red); }
    .btn-danger:hover { background: var(--red-bg); }
    .btn-sm { padding: 3px 9px; font-size: 13px; }
    input, select { font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; background: #fff; }
    input:focus, select:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .grid input { width: 100%; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.critical { background: var(--red-bg); }
    a.link { color: var(--primary); text-decoration: none; font-weight: 600; }
    a.link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
    .badge-in { background: var(--green-bg); color: var(--green); }
    .badge-out { background: var(--red-bg); color: var(--red); }
    .badge-crit { background: var(--red); color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; text-decoration: none; color: inherit; }
    .stat .label { color: var(--muted); font-size: 13px; }
    .stat .value { font-size: 24px; font-weight: 700; }
    .stat.alert .value { color: var(--red); }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; }
    .flash-success { background: var(--green-bg); color: var(--green); }
    .flash-error { background: var(--red-bg); color: var(--red); }
    .flash-warning { background: var(--amber-bg); color: var(--amber); }
    .muted { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 30px; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <div class="wrap {{ self.main_class() }}">
      <a class="brand" href="{{ url_for('index') }}">📦 Stok Takip</a>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Ürünler</a>
      <a href="{{ url_for('movements') }}" class="{{ 'active' if request.endpoint == 'movements' }}">Hareketler</a>
      <a href="{{ url_for('orders') }}" class="{{ 'active' if request.endpoint in ('orders', 'order_new', 'order_edit') }}">Meyve Siparişleri</a>
    </div>
  </header>
  <main class="wrap {% block main_class %}{% endblock %}">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
